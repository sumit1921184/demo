    <style>
        .main{
            height:100vh;

        aside{

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .header{
            display:flex;
            align-items: center;
            gap:10px;
            border:1px solid rgb(94, 91, 91);
            background-color: #EEF0F4;
            padding:10px;
            border-radius:20px

        }
    </style>
   
           
</head>
<body>
    <div class="main">
        <aside>
            <div class="header">

                    <p>A</p>
                </div>
                <p>ALF PTE. Ltd</p>

            </div>
            <ul>
                <li><a href="">Dashboard</a></li>

            </ul>

        </aside>
        <div class="content"></div>
